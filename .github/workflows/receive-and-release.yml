name: Receive and Release (Public Distribution)

# This workflow runs in the PUBLIC vantavoice repository.
#
# Distribution model (post R2 migration):
#   - All binaries (Setup.exe, *.nupkg, releases.win-*.json) live in application CDN
#     are served via https://vantavoice.cdn.papagood.net.
#   - This repository ONLY publishes a lightweight GitHub Release for visibility,
#     pointing users and tooling to the R2 download URLs.
#   - No binaries are committed to this repository tree (no `downloads/` writes).
#   - No binaries are attached as Release assets, so GitHub-generated
#     "Source code (zip|tar.gz)" archives stay small.

on:
  repository_dispatch:
    types: [publish-public-dist]

permissions:
  contents: write    # required only to create the release record

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Determine R2 stability channel
        id: channel
        run: |
          if [[ "${{ github.event.client_payload.prerelease }}" == "true" ]]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          else
            echo "channel=stable" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release notes (R2 download links only)
        id: notes
        env:
          TAG:           ${{ github.event.client_payload.tag }}
          CHANNEL:       ${{ steps.channel.outputs.channel }}
          SETUP_X64:     ${{ github.event.client_payload.setup_x64_size }}
          SETUP_X86:     ${{ github.event.client_payload.setup_x86_size }}
          HIGHLIGHTS:    ${{ github.event.client_payload.highlights }}
          R2_BASE:       https://vantavoice.cdn.papagood.net
        run: |
          cat > release_notes.md <<EOF
          ## VantaVoice ${TAG}

          All artifacts for this release are hosted on Vanta Voice CDN.
          GitHub Release is informational only and does not contain binaries.

          ### Primary download (recommended)
          - Branded launcher: ${R2_BASE}/${CHANNEL}/VantaVoice-Setup.exe

          ### Direct installers
          - Windows x64 (~${SETUP_X64}): ${R2_BASE}/${CHANNEL}/VantaVoice-win-x64-Setup.exe
          - Windows x86 (~${SETUP_X86}): ${R2_BASE}/${CHANNEL}/VantaVoice-win-x86-Setup.exe

          ### Update feed (consumed by in-app updater)
          - ${R2_BASE}/${CHANNEL}/releases.win-x64.json
          - ${R2_BASE}/${CHANNEL}/releases.win-x86.json

          ### Immutable per-version archive
          - ${R2_BASE}/releases/${TAG}/

          EOF

          # Append "What's New" + "Known Issues" sourced from GamerAssist release.yml
          if [[ -n "${HIGHLIGHTS}" ]]; then
            printf '%s\n' "${HIGHLIGHTS}" >> release_notes.md
            echo "" >> release_notes.md
          fi

          cat >> release_notes.md <<EOF
          ---
          Channel: \`${CHANNEL}\`
          Source repo (private): drvmukhin/GamerAssist
          EOF

      - name: Create GitHub Release (metadata only, no binary assets)
        uses: softprops/action-gh-release@v2
        with:
          tag_name:    ${{ github.event.client_payload.tag }}
          name:        "VantaVoice ${{ github.event.client_payload.tag }}"
          body_path:   release_notes.md
          prerelease:  ${{ github.event.client_payload.prerelease }}
          make_latest: true
          # Intentionally no `files:` — binaries live in R2.
